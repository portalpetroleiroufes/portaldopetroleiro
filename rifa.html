<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Portal do Petroleiro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --azul: #002d5b; --laranja: #ff6600; --fundo: #0f1115; --card: #1a1d24; }
        body { margin: 0; padding-bottom: 100px; font-family: 'Segoe UI', sans-serif; color: white; background: var(--fundo); }
        header { background: transparent; padding: 15px 20px; position: absolute; top: 0; width: 100%; z-index: 10; box-sizing: border-box; }
        .btn-voltar { background: rgba(0,0,0,0.5); color: white; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); }
        .capa-evento { width: 100%; height: 280px; position: relative; overflow: hidden; }
        .capa-evento img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }
        .capa-blur { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(transparent, var(--fundo)); }
        .container { max-width: 600px; margin: -50px auto 0; padding: 0 20px; position: relative; z-index: 5; }
        
        .info-evento h1 { margin: 0 0 5px 0; font-size: 28px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.2; }
        .tag-tipo { display: inline-block; background: var(--laranja); color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .card-ingresso { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .flex-ingresso { display: flex; justify-content: space-between; align-items: center; }
        .ingresso-detalhes h3 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
        .ingresso-preco { color: #00ff88; font-weight: bold; font-size: 18px; }
        .ingresso-promo { color: #ffcc00; font-size: 13px; font-weight: bold; margin-top: 5px; background: rgba(255, 204, 0, 0.1); padding: 5px 8px; border-radius: 6px; display: inline-block; border: 1px dashed #ffcc00;}
        
        .contador { display: flex; align-items: center; background: #0a0c0f; padding: 5px; border-radius: 8px; border: 1px solid #444; }
        .btn-cont { background: #333; color: white; border: none; width: 40px; height: 40px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-cont:active { background: var(--laranja); }
        .input-qtd { width: 50px; height: 40px; background: transparent; border: none; color: white; font-size: 20px; font-weight: bold; text-align: center; outline: none; -moz-appearance: textfield; }
        .input-qtd::-webkit-outer-spin-button, .input-qtd::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .form-dados { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; }
        .form-dados h4 { margin-top: 0; margin-bottom: 15px; color: #aaa; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input[type="text"], input[type="email"], input[type="tel"], select { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #444; border-radius: 8px; background: #0a0c0f; color: white; font-size: 16px; box-sizing: border-box; outline: none; font-family: inherit; }
        input:focus, select:focus { border-color: var(--laranja); }

        .barra-pagamento { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 15px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); z-index: 100; }
        .barra-total { display: flex; flex-direction: column; }
        .barra-total span { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;}
        .barra-total strong { font-size: 24px; color: #00ff88; }
        .btn-comprar { background: var(--laranja); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s;}
        .btn-comprar:hover { filter: brightness(1.2); }

        #tela-pagamento, #tela-sucesso { display: none; background: var(--card); padding: 30px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; text-align: center; }
        .pix-box { font-family: monospace; font-size: 18px; background: #0a0c0f; padding: 20px; border: 1px dashed #aaa; word-break: break-all; border-radius: 8px; margin: 15px 0; color: #fff;}
        .recibo-box { font-size: 24px; color: #00ff88; font-weight: 900; letter-spacing: 2px; margin: 20px 0; background: #0a0c0f; padding: 20px; border-radius: 10px; border: 1px solid #00ff88; }
    </style>
</head>
<body>

    <header><button class="btn-voltar" onclick="window.location.href='index.html'"><i class="fas fa-chevron-left"></i> Voltar</button></header>

    <div id="corpo-site" style="text-align:center; padding-top: 100px;">
        <h2><i class="fas fa-spinner fa-spin"></i> Carregando...</h2>
    </div>

    <script>
        // Pega o ID do produto que veio no link (Ex: rifa.html?id=1712345678)
        const urlParams = new URLSearchParams(window.location.search);
        const idProdutoURL = urlParams.get('id');

        let produtoAtual = null; 
        let valorCalculado = 0; 
        let precoLimpoBase = 0; 
        let precoLimpoPromo = 0;

        fetch('/api/loja').then(res => res.json()).then(produtos => {
            // Acha o produto certo na lista
            produtoAtual = produtos.find(p => p.id == idProdutoURL);

            if(!produtoAtual) {
                document.getElementById('corpo-site').innerHTML = `<h2>Anúncio não encontrado ou esgotado.</h2><button class="btn-comprar" onclick="window.location.href='index.html'">Voltar ao Início</button>`;
                return;
            }

            // Define cores baseadas no tipo
            let corTag = produtoAtual.tipo === 'Ingresso' ? '#00cc66' : produtoAtual.tipo === 'Minicurso' ? '#0099ff' : produtoAtual.tipo === 'Camisa' ? '#9900cc' : '#ff6600';

            precoLimpoBase = parseFloat(String(produtoAtual.preco).replace(/[R$\s]/gi, '').replace(',', '.'));
            let pQtd = parseInt(produtoAtual.promoQtd) || 0;
            precoLimpoPromo = parseFloat(String(produtoAtual.promoPreco).replace(/[R$\s]/gi, '').replace(',', '.')) || 0;

            let htmlPromo = '';
            if(pQtd > 0 && precoLimpoPromo > 0) {
                htmlPromo = `<div class="ingresso-promo"><i class="fas fa-star"></i> Pacote: ${pQtd} por R$ ${precoLimpoPromo.toFixed(2).replace('.', ',')}</div>`;
            }

            // Exibe campo de tamanho apenas se for Camisa
            let htmlTamanho = '';
            if(produtoAtual.tipo === 'Camisa') {
                htmlTamanho = `
                    <label style="color:#aaa; font-weight:bold; display:block; margin-bottom:5px;">Tamanho da Peça:</label>
                    <select id="tamanho-camisa" required>
                        <option value="" disabled selected>Escolha o tamanho...</option>
                        <option value="P">Tamanho P</option>
                        <option value="M">Tamanho M</option>
                        <option value="G">Tamanho G</option>
                        <option value="GG">Tamanho GG</option>
                        <option value="XG">Tamanho XG</option>
                    </select>
                `;
            }

            document.getElementById('corpo-site').innerHTML = `
                <div class="capa-evento"><img src="${produtoAtual.imagem || 'https://via.placeholder.com/1000'}"><div class="capa-blur"></div></div>
                <div class="container">
                    <div class="info-evento">
                        <span class="tag-tipo" style="background:${corTag}">${produtoAtual.tipo}</span>
                        <h1>${produtoAtual.titulo}</h1>
                        <p style="color:#ccc; font-size:14px;"><i class="fas fa-info-circle"></i> ${produtoAtual.descricao || 'Adquira agora e garanta sua vaga/número.'}</p>
                    </div>

                    <form id="formCheckout">
                        <div class="card-ingresso">
                            <div class="flex-ingresso">
                                <div class="ingresso-detalhes">
                                    <h3>Quantidade</h3>
                                    <div class="ingresso-preco">R$ ${precoLimpoBase.toFixed(2).replace('.', ',')} / un</div>
                                    ${htmlPromo}
                                </div>
                                <div class="contador">
                                    <button type="button" class="btn-cont" onclick="mudarQtd(-1)"><i class="fas fa-minus"></i></button>
                                    <input type="number" id="input-qtd" class="input-qtd" value="1" min="1" oninput="calcularTotal()">
                                    <button type="button" class="btn-cont" onclick="mudarQtd(1)"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                            <div style="margin-top:15px; padding-top:15px; border-top:1px dashed #444; text-align:right;">
                                <span style="color:#aaa; font-size:14px;">Subtotal: </span>
                                <strong style="color:#00ff88; font-size:18px;">R$ <span id="subtotal-box">${precoLimpoBase.toFixed(2).replace('.', ',')}</span></strong>
                            </div>
                        </div>

                        <div class="form-dados">
                            <h4>Dados do Comprador (Obrigatório)</h4>
                            <input type="text" id="nome" placeholder="Nome Completo" required>
                            <input type="tel" id="telefone" placeholder="WhatsApp (Ex: 27999999999)" required maxlength="11">
                            <input type="email" id="email" placeholder="Seu E-mail principal" required>
                            <input type="email" id="email-confirma" placeholder="Confirme seu E-mail" required>
                            ${htmlTamanho}
                        </div>

                        <div class="barra-pagamento" id="barra-checkout">
                            <div class="barra-total"><span>Total a pagar</span><strong>R$ <span id="total-tela">${precoLimpoBase.toFixed(2).replace('.', ',')}</span></strong></div>
                            <button type="button" class="btn-comprar" onclick="irParaPagamento()">Continuar <i class="fas fa-arrow-right"></i></button>
                        </div>
                    </form>

                    <div id="tela-pagamento">
                        <h2 style="color:#ffcc00; margin-top:0;"><i class="fas fa-qrcode"></i> Finalizar Pagamento</h2>
                        <p>Envie o PIX de <strong>R$ <span id="total-pix"></span></strong> para a chave abaixo.</p>
                        <div class="pix-box"><strong>CHAVE PIX:</strong><br>${produtoAtual.pix}</div>
                        ${produtoAtual.linkCartao ? `<a href="${produtoAtual.linkCartao}" target="_blank" style="background:#009EE3; color:white; padding:15px; border-radius:8px; display:block; text-decoration:none; font-weight:bold; margin-bottom:15px;"><i class="fas fa-credit-card"></i> PAGAR COM CARTÃO</a>` : ''}
                        
                        <button onclick="simularAutomação()" style="background: #25D366; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; border: 2px dashed #fff; margin-top: 10px;">✅ SIMULAR: APROVADO</button>
                        <p style="font-size:12px; color:#888; margin-top:10px;">*A liberação automática exige integração com Mercado Pago online.</p>
                    </div>

                    <div id="tela-sucesso">
                        <h2 style="color: #00ff88; margin-top:0;"><i class="fas fa-check-circle"></i> Compra Confirmada!</h2>
                        <p style="font-size:14px; color:#aaa;">O comprovante foi enviado para: <strong id="res-email" style="color:white;"></strong></p>
                        <h3>Seu Código / Recibo:</h3>
                        <div class="recibo-box" id="codigo-recibo"></div>
                        <div style="background: rgba(255,204,0,0.1); color: #ffcc00; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1px dashed #ffcc00;"><i class="fas fa-camera"></i> Tire um print desta página por segurança!</div>
                        <button onclick="window.location.href='index.html'" style="background: #333; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; margin-top:20px; font-weight:bold;">Voltar ao Início</button>
                    </div>
                </div>
            `;
            calcularTotal();
        });

        // CALCULA O PREÇO EM TEMPO REAL
        function mudarQtd(valor) {
            let input = document.getElementById('input-qtd');
            let novaQtd = parseInt(input.value) + valor;
            if(novaQtd >= 1) { input.value = novaQtd; calcularTotal(); }
        }

        function calcularTotal() {
            let qtd = parseInt(document.getElementById('input-qtd').value);
            if(isNaN(qtd) || qtd < 1) { qtd = 1; document.getElementById('input-qtd').value = 1; }

            let pQtd = parseInt(produtoAtual.promoQtd) || 0;
            if(pQtd > 0 && precoLimpoPromo > 0) {
                let pacotesPromo = Math.floor(qtd / pQtd);
                let numerosAvulsos = qtd % pQtd;
                valorCalculado = (pacotesPromo * precoLimpoPromo) + (numerosAvulsos * precoLimpoBase);
            } else { valorCalculado = qtd * precoLimpoBase; }
            
            let formatado = valorCalculado.toFixed(2).replace('.', ',');
            document.getElementById('total-tela').innerText = formatado;
            document.getElementById('subtotal-box').innerText = formatado;
        }

        // VALIDAÇÃO E PAGAMENTO
        function irParaPagamento() {
            const nome = document.getElementById('nome').value.trim();
            const tel = document.getElementById('telefone').value.replace(/\D/g, '');
            const email = document.getElementById('email').value.trim();
            const emailConf = document.getElementById('email-confirma').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(nome.length < 3) return alert("❌ Digite seu nome completo.");
            if(tel.length < 10 || tel.length > 11) return alert("❌ Digite um WhatsApp válido com DDD.");
            if(!emailRegex.test(email)) return alert("❌ Digite um E-mail válido.");
            if(email !== emailConf) return alert("❌ Os e-mails não batem. Verifique para não perder o seu ingresso!");
            
            if(produtoAtual.tipo === 'Camisa') {
                const tamanho = document.getElementById('tamanho-camisa').value;
                if(!tamanho) return alert("❌ Por favor, selecione o tamanho da camisa.");
            }

            document.getElementById('formCheckout').style.display = 'none';
            document.getElementById('barra-checkout').style.display = 'none';
            document.getElementById('tela-pagamento').style.display = 'block';
            document.getElementById('total-pix').innerText = valorCalculado.toFixed(2).replace('.', ',');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // DISPARA PRO SERVIDOR
        async function simularAutomação() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const qtd = document.getElementById('input-qtd').value;
            let tamanho = null;
            
            if(produtoAtual.tipo === 'Camisa') { tamanho = document.getElementById('tamanho-camisa').value; }

            try {
                const res = await fetch('/api/checkout-automatico', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ idProduto: produtoAtual.id, nome, email, qtd: parseInt(qtd), tamanho })
                });
                const data = await res.json();
                
                if(data.erro) return alert("⚠️ " + data.erro);
                
                document.getElementById('tela-pagamento').style.display = 'none';
                document.getElementById('tela-sucesso').style.display = 'block';
                document.getElementById('res-email').innerText = email;
                document.getElementById('codigo-recibo').innerText = data.recibo;
            } catch(e) { alert("Erro de conexão com o servidor."); }
        }
    </script>
</body>
</html>
