<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Portal do Petroleiro</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root { --primary: #002d5b; --accent: #ff6600; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-top: 20px; }
        label { font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #editor { height: 300px; margin-bottom: 20px; background: white; }
        .btn-post { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn-post:hover { background: #e65c00; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-edit"></i> Publicar no Portal</h1>
    
    <div class="card">
        <form id="formNoticia" action="/api/admin/postar-noticia" method="POST" enctype="multipart/form-data">
            <label>Título da Matéria</label>
            <input type="text" name="name" placeholder="Ex: Novo Estágio na Petrobras" required>
            
            <label>Categoria</label>
            <select name="category">
                <option value="Institucional">Institucional</option>
                <option value="Estágios e Empregos">Estágios</option>
                <option value="Eventos">Eventos</option>
            </select>

            <label>Conteúdo da Notícia</label>
            <div id="editor"></div>
            <input type="hidden" name="description" id="hiddenDesc">

            <label>Fotos (pode selecionar várias)</label>
            <input type="file" name="productImages" multiple accept="image/*">

            <button type="submit" class="btn-post">PUBLICAR AGORA</button>
        </form>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, false] }],
                ['bold', 'italic', 'underline'],
                ['link', 'blockquote'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }]
            ]
        }
    });

    document.getElementById('formNoticia').onsubmit = function() {
        document.getElementById('hiddenDesc').value = quill.root.innerHTML;
    };
</script>
</body>
</html>
