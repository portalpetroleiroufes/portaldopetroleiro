<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Meus Anexos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <form action="/suporte" method="post">
            <h2>Contato de Suporte</h2>
            <p style="text-align: center; margin-bottom: 20px;">
                Tem alguma dúvida, sugestão ou encontrou um problema? Nos envie uma mensagem!
            </p>

            <div class="input-group">
                <label for="name">Seu Nome:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="input-group">
                <label for="email">Seu E-mail para Contato:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="subject">Assunto:</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="input-group">
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>
        <div class="extra-links">
            <a href="/">Voltar para o Início</a>
        </div>
    </div>
</body>
</html>
