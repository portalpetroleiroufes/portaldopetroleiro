<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Petroleiro | Reserva Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #002d5b; --secondary: #ff6600; --success: #28a745; --bg: #f1f3f5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; padding: 18px; text-align: center; border-bottom: 5px solid var(--secondary); font-weight: 800; font-size: 1.1rem; }
        .banner { width: 100%; height: 260px; position: relative; background: #eee; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        .live-badge { position: absolute; top: 15px; left: 15px; background: #e31c1c; color: white; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; animation: blink 1s infinite; }
        .content { padding: 25px; }
        .price-tag { font-size: 32px; font-weight: 900; color: var(--secondary); display: block; }
        .product-title { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        .promo-banner { background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%); border: 2px dashed var(--secondary); padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; }
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 25px; background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 25px; }
        .qty-btn { width: 50px; height: 50px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 24px; cursor: pointer; }
        .qty-num { font-size: 28px; font-weight: 900; color: var(--primary); }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn-main { background: var(--success); color: white; border: none; width: 100%; padding: 20px; font-size: 18px; font-weight: 800; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
        .full-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; padding: 30px; box-sizing: border-box; text-align: center; overflow-y: auto; }
        .timer-circle { font-size: 45px; font-weight: 900; color: #e31c1c; margin: 20px 0; font-family: monospace; }
        .pix-copy-box { background: #f1f3f5; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; word-break: break-all; margin: 15px 0; border: 1px dashed #999; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div id="mainView" class="container">
    <div class="header"><i class="fas fa-ticket-alt"></i> PORTAL DO PETROLEIRO</div>
    <div id="loading" style="padding:50px; text-align:center;"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
    
    <div id="vitrine" style="display:none;">
        <div class="banner">
            <div class="live-badge">CAMPANHA ATIVA</div>
            <img id="prod-img" src="">
        </div>
        <div class="content">
            <span class="price-tag" id="prod-preco"></span>
            <h1 class="product-title" id="prod-titulo"></h1>
            <p id="prod-desc" style="color:#666;"></p>
            
            <div id="promo-area"></div>

            <div class="qty-box">
                <button class="qty-btn" onclick="mudarQtd(-1)">-</button>
                <span class="qty-num" id="qtdShow">1</span>
                <button class="qty-btn" onclick="mudarQtd(1)">+</button>
            </div>
            
            <div id="totalShow" style="text-align:center; font-weight:800; font-size:22px; margin-bottom:20px; color:var(--primary);">Total: R$ 0,00</div>
            
            <div class="input-group"><input type="text" id="nome" placeholder="Nome Completo"></div>
            <div class="input-group"><input type="text" id="zap" placeholder="WhatsApp (DDD + Número)"></div>
            <div class="input-group"><input type="email" id="email" placeholder="Seu melhor E-mail"></div>
            
            <button onclick="revisar()" class="btn-main">RESERVAR AGORA <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
</div>

<div id="screenReview" class="full-screen">
    <i class="fas fa-user-check" style="font-size: 50px; color: var(--primary);"></i>
    <h2>Confirme seus Dados</h2>
    <div id="dadosConfirmar" style="text-align:left; background:#f8f9fa; padding:20px; border-radius:12px; margin-bottom:20px; border-left: 5px solid var(--secondary);"></div>
    <button onclick="finalizarReserva()" id="btnFinalizar" class="btn-main">TUDO CERTO, IR PARA PAGAMENTO</button>
    <button onclick="fecharTelas()" style="margin-top:20px; background:none; border:none; color:#999; text-decoration:underline;">Voltar e editar</button>
</div>

<div id="screenPayment" class="full-screen">
    <h2 style="color: var(--primary);">Aguardando PIX...</h2>
    <div class="timer-circle" id="timerDisplay">06:00</div>
    <div style="width:200px; height:200px; margin: 0 auto; border: 1px solid #eee; padding:10px; border-radius:15px;">
        <img src="/uploads/qrcode.jpg" style="width:100%">
    </div>
    <div class="pix-copy-box" id="pixCode"></div>
    <button onclick="copiarPix()" class="btn-main" style="background:var(--primary)">COPIAR CÓDIGO PIX</button>
    <div id="infoFinal" style="margin-top:20px; font-weight:bold; color:var(--primary); font-size:20px;"></div>
</div>

<script>
    let produto = null;
    let qtd = 1;
    let cronometro = null;

    async function iniciar() {
        const res = await fetch('/api/loja');
        const data = await res.json();
        if(!data.length) {
            document.getElementById('loading').innerHTML = "<h1>Nenhuma campanha ativa.</h1>";
            return;
        }
        // Pega a última rifa cadastrada no Admin
        produto = data[data.length - 1];
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('vitrine').style.display = 'block';
        
        document.getElementById('prod-img').src = "/" + produto.imagem;
        document.getElementById('prod-titulo').innerText = produto.titulo;
        document.getElementById('prod-desc').innerText = produto.descricao;
        document.getElementById('prod-preco').innerText = "R$ " + produto.preco;
        
        if(produto.promoQtd) {
            document.getElementById('promo-area').innerHTML = `
                <div class="promo-banner">
                    <h3>🔥 SUPER PROMOÇÃO 🔥</h3>
                    <span style="font-size:20px; font-weight:900;">${produto.promoQtd} Números por R$ ${produto.promoPreco}</span>
                </div>`;
        }
        recalcular();
    }

    function mudarQtd(n) {
        qtd = Math.max(1, qtd + n);
        document.getElementById('qtdShow').innerText = qtd;
        recalcular();
    }

    function recalcular() {
        let total = (produto.promoQtd && qtd >= produto.promoQtd) ? 
            (Math.floor(qtd / produto.promoQtd) * produto.promoPreco) + ((qtd % produto.promoQtd) * produto.preco) : 
            (qtd * produto.preco);
        document.getElementById('totalShow').innerText = `Total: R$ ${total.toFixed(2)}`;
    }

    function revisar() {
        const nome = document.getElementById('nome').value;
        const zap = document.getElementById('zap').value;
        const email = document.getElementById('email').value;
        
        if(!nome || !zap || !email) return alert("Por favor, preencha todos os campos!");

        document.getElementById('dadosConfirmar').innerHTML = `
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>WhatsApp:</strong> ${zap}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Quantidade:</strong> ${qtd} números</p>
        `;
        document.getElementById('screenReview').style.display = 'block';
    }

    async function finalizarReserva() {
        const btn = document.getElementById('btnFinalizar');
        btn.disabled = true;
        btn.innerText = "PROCESSANDO...";

        const payload = {
            idProduto: produto.id,
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('zap').value,
            email: document.getElementById('email').value,
            qtd: qtd
        };

        try {
            const res = await fetch('/api/checkout-automatico', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const r = await res.json();
            if(r.sucesso) {
                abrirPagamento(r);
            } else {
                alert("Erro ao processar reserva. Tente novamente.");
                btn.disabled = false;
                btn.innerText = "TUDO CERTO, IR PARA PAGAMENTO";
            }
        } catch (e) {
            alert("Erro de conexão com o servidor.");
            btn.disabled = false;
        }
    }

    function abrirPagamento(r) {
        document.getElementById('screenReview').style.display = 'none';
        document.getElementById('screenPayment').style.display = 'block';
        document.getElementById('pixCode').innerText = produto.pix;
        document.getElementById('infoFinal').innerText = `Total: R$ ${r.valor}`;
        
        let tempo = 360;
        cronometro = setInterval(() => {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            document.getElementById('timerDisplay').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            if (--tempo < 0) { clearInterval(cronometro); location.reload(); }
        }, 1000);
    }

    function fecharTelas() { document.getElementById('screenReview').style.display = 'none'; }
    function copiarPix() { navigator.clipboard.writeText(document.getElementById('pixCode').innerText); alert("Código PIX Copiado!"); }

    iniciar();
</script>
</body>
</html>
