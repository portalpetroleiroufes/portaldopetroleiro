<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Petroleiro | Reserva Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #002d5b; --secondary: #ff6600; --success: #28a745; --bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.1); }
        
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--secondary); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; }
        
        .banner { width: 100%; height: 280px; position: relative; background: #eee; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 15px; left: 15px; background: #e31c1c; color: white; padding: 6px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; animation: blink 1.2s infinite; }

        .content { padding: 30px; }
        .price-tag { font-size: 35px; font-weight: 900; color: var(--secondary); display: block; margin-bottom: 5px; }
        .product-title { font-size: 26px; font-weight: 800; color: var(--primary); line-height: 1.2; margin-bottom: 15px; }

        .promo-card { background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%); border: 2px dashed var(--secondary); padding: 15px; border-radius: 15px; margin: 20px 0; text-align: center; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 30px; background: #f1f3f5; padding: 20px; border-radius: 15px; margin: 25px 0; }
        .qty-btn { width: 55px; height: 55px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 24px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .qty-btn:active { transform: scale(0.9); }
        .qty-num { font-size: 30px; font-weight: 900; color: var(--primary); min-width: 40px; text-align: center; }

        .input-group { margin-bottom: 18px; }
        .input-group input { width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .input-group input:focus { border-color: var(--secondary); outline: none; background: #fffdfb; }

        .btn-confirm { background: var(--success); color: white; border: none; width: 100%; padding: 22px; font-size: 18px; font-weight: 800; border-radius: 15px; cursor: pointer; box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4); text-transform: uppercase; margin-top: 10px; }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; padding: 40px 20px; box-sizing: border-box; overflow-y: auto; text-align: center; }
        .timer { font-size: 50px; font-weight: 900; color: #e31c1c; margin: 20px 0; font-family: 'Courier New', monospace; }
        .pix-code { background: #f8f9fa; padding: 20px; border-radius: 10px; font-family: monospace; font-size: 14px; word-break: break-all; border: 1px dashed #bbb; margin: 20px 0; }

        @keyframes blink { 0% {opacity:1} 50% {opacity:0.4} 100% {opacity:1} }
    </style>
</head>
<body>

<div id="mainView" class="container">
    <div class="header">PORTAL DO PETROLEIRO</div>
    <div id="loading" style="padding:100px 20px; text-align:center;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color:var(--secondary)"></i>
        <p style="margin-top:20px; font-weight:bold;">Carregando sua reserva...</p>
    </div>
    <div id="vitrine" style="display:none;"></div>
</div>

<div id="screenReview" class="overlay">
    <i class="fas fa-check-circle" style="font-size: 70px; color: var(--success);"></i>
    <h2 style="color: var(--primary); margin: 20px 0;">Quase lá!</h2>
    <p>Confira se seus dados estão corretos:</p>
    <div id="resumoDados" style="text-align:left; background:#f8f9fa; padding:20px; border-radius:15px; margin: 25px 0; border-left: 6px solid var(--secondary);"></div>
    <button onclick="finalizarPagamento()" id="btnPagar" class="btn-confirm">TUDO CERTO, IR PARA PAGAMENTO</button>
    <p onclick="fecharOverlay()" style="margin-top:25px; color:#999; text-decoration:underline; cursor:pointer;">Voltar e editar</p>
</div>

<div id="screenPayment" class="overlay">
    <h2 style="color: var(--primary);">Reserva Realizada!</h2>
    <p>Realize o pagamento em até:</p>
    <div class="timer" id="timer">06:00</div>
    <div style="width:220px; height:220px; margin: 0 auto; border: 2px solid #eee; padding:10px; border-radius:20px;">
        <img src="/uploads/qrcode.jpg" style="width:100%; height:100%; object-fit:contain;">
    </div>
    <div class="pix-code" id="pixCopia"></div>
    <button onclick="copiarPix()" class="btn-confirm" style="background:var(--primary)">COPIAR CHAVE PIX</button>
    <div id="detalhesFinais" style="margin-top:20px; background:#eef9f1; padding:15px; border-radius:10px; text-align:left; color:#1e4620;"></div>
</div>

<script>
    let item = null;
    let qtd = 1;

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const res = await fetch('/api/loja');
        const data = await res.json();
        item = id ? data.find(p => p.id == id) : data[data.length - 1];

        if(!item) {
            document.getElementById('loading').innerHTML = "<h2>Campanha não encontrada.</h2>";
            return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('vitrine').style.display = 'block';
        renderConteudo();
    }

    function renderConteudo() {
        document.getElementById('vitrine').innerHTML = `
            <div class="banner">
                <div class="badge">${item.tipo.toUpperCase()} ATIVO</div>
                <img src="/${item.imagem}">
            </div>
            <div class="content">
                <span class="price-tag">R$ ${item.preco}</span>
                <h1 class="product-title">${item.titulo}</h1>
                <p style="color:#666; line-height:1.6;">${item.descricao}</p>

                ${item.promoQtd ? `
                <div class="promo-card">
                    <h4 style="margin:0; color:#d35400;">🔥 OFERTA ESPECIAL 🔥</h4>
                    <span style="font-size:20px; font-weight:900; color:var(--primary);">${item.promoQtd} Unidades por R$ ${item.promoPreco}</span>
                </div>` : ''}

                <span style="text-align:center; display:block; font-weight:bold; color:#888;">SELECIONE A QUANTIDADE</span>
                <div class="qty-box">
                    <button class="qty-btn" onclick="mudarQtd(-1)">-</button>
                    <span class="qty-num" id="displayQtd">1</span>
                    <button class="qty-btn" onclick="mudarQtd(1)">+</button>
                </div>

                <div id="displayTotal" style="text-align:center; font-size:24px; font-weight:900; color:var(--primary); margin-bottom:30px;">Total: R$ ${item.preco}</div>

                <div class="input-group"><input type="text" id="u-nome" placeholder="Nome Completo"></div>
                <div class="input-group"><input type="email" id="u-email" placeholder="Seu melhor E-mail"></div>
                <div class="input-group"><input type="tel" id="u-zap" placeholder="WhatsApp (DDD + Número)"></div>

                <button onclick="revisar()" class="btn-confirm">RESERVAR AGORA <i class="fas fa-arrow-right"></i></button>
            </div>
        `;
    }

    function mudarQtd(v) {
        qtd = Math.max(1, qtd + v);
        document.getElementById('displayQtd').innerText = qtd;
        let total = (item.promoQtd && qtd >= item.promoQtd) ? 
            (Math.floor(qtd/item.promoQtd)*item.promoPreco) + ((qtd%item.promoQtd)*item.preco) : 
            (qtd * item.preco);
        document.getElementById('displayTotal').innerText = `Total: R$ ${total.toFixed(2)}`;
    }

    function revisar() {
        const n = document.getElementById('u-nome').value;
        const e = document.getElementById('u-email').value;
        if(!n || !e) return alert("Por favor, preencha Nome e E-mail!");
        
        document.getElementById('resumoDados').innerHTML = `
            <p><strong>Item:</strong> ${item.titulo}</p>
            <p><strong>Participante:</strong> ${n}</p>
            <p><strong>Quantidade:</strong> ${qtd} un.</p>
        `;
        document.getElementById('screenReview').style.display = 'block';
    }

    async function finalizarPagamento() {
        const btn = document.getElementById('btnPagar');
        btn.innerText = "PROCESSANDO...";
        btn.disabled = true;

        const dados = {
            idProduto: item.id,
            nome: document.getElementById('u-nome').value,
            email: document.getElementById('u-email').value,
            telefone: document.getElementById('u-zap').value,
            qtd: qtd
        };

        try {
            const res = await fetch('/api/checkout-automatico', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            const r = await res.json();
            if(r.sucesso) {
                document.getElementById('screenReview').style.display = 'none';
                document.getElementById('screenPayment').style.display = 'block';
                document.getElementById('pixCopia').innerText = item.pix;
                document.getElementById('detalhesFinais').innerHTML = `
                    <p><b>Total:</b> R$ ${r.valor}</p>
                    <p><b>Seus Números:</b> <br><span style="color:red; font-size:22px; font-weight:bold;">${r.numeros.join(', ')}</span></p>
                `;
                iniciarTimer(360);
            }
        } catch (err) {
            alert("Erro de conexão.");
            btn.innerText = "TENTAR NOVAMENTE";
            btn.disabled = false;
        }
    }

    function iniciarTimer(tempo) {
        const d = document.getElementById('timer');
        const interval = setInterval(() => {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            d.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            if (--tempo < 0) { clearInterval(interval); location.reload(); }
        }, 1000);
    }

    function fecharOverlay() { document.getElementById('screenReview').style.display = 'none'; }
    function copiarPix() { navigator.clipboard.writeText(item.pix); alert("PIX Copiado!"); }

    init();
</script>
</body>
</html>
