<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Petroleiro | Reserva Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #002d5b; --secondary: #ff6600; --success: #28a745; --bg: #f1f3f5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* Header Profissional */
        .header { background: var(--primary); color: white; padding: 18px; text-align: center; border-bottom: 5px solid var(--secondary); font-weight: 800; letter-spacing: 1px; font-size: 1.1rem; }
        
        .banner { width: 100%; height: 260px; position: relative; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        .live-badge { position: absolute; top: 15px; left: 15px; background: #e31c1c; color: white; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; animation: blink 1s infinite; }

        .content { padding: 25px; }
        .price-tag { font-size: 32px; font-weight: 900; color: var(--secondary); display: block; margin-bottom: 5px; }
        .product-title { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 10px; line-height: 1.2; }

        /* DESTAQUE DA PROMOÇÃO (ESTILO RIFA PROFISSIONAL) */
        .promo-banner { background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%); border: 2px dashed var(--secondary); padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; }
        .promo-banner h3 { margin: 0; color: #d35400; font-size: 18px; text-transform: uppercase; }
        .promo-highlight { font-size: 22px; font-weight: 900; color: var(--primary); display: block; margin-top: 5px; }

        /* SELETOR DE QUANTIDADE */
        .qty-label { text-align: center; font-weight: bold; font-size: 14px; color: #666; margin-bottom: 8px; display: block; }
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 25px; background: #f8f9fa; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 25px; }
        .qty-btn { width: 50px; height: 50px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .qty-btn:active { transform: scale(0.9); }
        .qty-num { font-size: 28px; font-weight: 900; color: var(--primary); min-width: 45px; text-align: center; }

        .total-display { text-align: center; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 25px; padding: 10px; border-top: 1px solid #eee; }

        /* FORMULÁRIO */
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .input-group input:focus { border-color: var(--secondary); outline: none; background: #fffdfb; }

        .btn-main { background: var(--success); color: white; border: none; width: 100%; padding: 20px; font-size: 18px; font-weight: 800; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3); text-transform: uppercase; }

        /* TELAS DE OVERLAY (PAGAMENTO E CONFIRMAÇÃO) */
        .full-screen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; padding: 30px; box-sizing: border-box; overflow-y: auto; text-align: center; }
        .timer-circle { font-size: 45px; font-weight: 900; color: #e31c1c; margin: 20px 0; font-family: 'Courier New', monospace; letter-spacing: 2px; }
        .qr-code-area { width: 220px; height: 220px; margin: 20px auto; background: #fff; border: 2px solid #eee; padding: 10px; border-radius: 15px; }
        .qr-code-area img { width: 100%; height: 100%; object-fit: contain; }
        .pix-copy-box { background: #f1f3f5; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; word-break: break-all; margin: 15px 0; border: 1px dashed #999; }
        
        .summary-card { text-align: left; background: #f8f9fa; padding: 20px; border-radius: 12px; margin: 20px 0; border-left: 5px solid var(--secondary); }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div id="mainView" class="container">
    <div class="header"><i class="fas fa-ticket-alt"></i> PORTAL DO PETROLEIRO</div>
    <div id="loading" style="padding:50px; text-align:center;">
        <i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--secondary)"></i>
        <p>Carregando rifa...</p>
    </div>
    <div id="vitrine" style="display:none;"></div>
</div>

<div id="screenReview" class="full-screen">
    <i class="fas fa-user-check" style="font-size: 50px; color: var(--primary);"></i>
    <h2 style="color: var(--primary); margin-top: 15px;">Confirme seus Dados</h2>
    <div id="dadosConfirmar" class="summary-card"></div>
    <button onclick="finalizarReserva()" class="btn-main">TUDO CERTO, IR PARA PAGAMENTO</button>
    <button onclick="fecharTelas()" style="margin-top:20px; background:none; border:none; color:#999; text-decoration:underline; cursor:pointer;">Voltar e editar</button>
</div>

<div id="screenPayment" class="full-screen">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <button onclick="cancelarVenda()" style="background:#eee; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;"><i class="fas fa-chevron-left"></i> VOLTAR</button>
        <span style="color:#666; font-size:12px; font-weight:bold;">RESERVA #<span id="resID"></span></span>
    </div>

    <h2 style="color: var(--primary); margin-top: 25px;">Aguardando PIX...</h2>
    <div class="timer-circle" id="timerDisplay">06:00</div>

    <div class="qr-code-area">
        <img src="uploads/qrcode.jpg" alt="QR Code PIX">
    </div>

    <div class="pix-copy-box" id="pixCode"></div>
    <button onclick="copiarPix()" class="btn-main" style="background:var(--primary); padding:15px; font-size:14px;">COPIAR CÓDIGO PIX</button>

    <div class="summary-card">
        <p style="margin:0;"><strong>Valor Total:</strong> <span id="finalValor"></span></p>
        <p style="margin:5px 0 0 0;"><strong>Seus Números:</strong> <span id="finalNums" style="color:var(--secondary); font-weight:bold;"></span></p>
    </div>
    <p style="font-size:12px; color:#777;"><i class="fas fa-shield-alt"></i> Pague dentro do prazo para não perder seus números.</p>
</div>

<script>
    let produto = null;
    let qtd = 1;
    let cronometro = null;

    async function iniciar() {
        const res = await fetch('/api/loja');
        const data = await res.json();
        if(!data.length) return;
        produto = data[data.length - 1];
        document.getElementById('loading').style.display = 'none';
        document.getElementById('vitrine').style.display = 'block';
        renderizar();
    }

    function renderizar() {
        let precoPromo = (produto.promoPreco / produto.promoQtd).toFixed(2);
        document.getElementById('vitrine').innerHTML = `
            <div class="banner">
                <div class="live-badge">CAMPANHA ATIVA</div>
                <img src="${produto.imagem || ''}">
            </div>
            <div class="content">
                <span class="price-tag">R$ ${produto.preco}</span>
                <h1 class="product-title">${produto.titulo}</h1>
                <p style="color:#666; font-size:14px; margin-bottom:20px;">${produto.descricao}</p>

                ${produto.promoQtd ? `
                <div class="promo-banner">
                    <h3>🔥 Super Promoção 🔥</h3>
                    <span class="promo-highlight">${produto.promoQtd} Números por apenas R$ ${produto.promoPreco}</span>
                    <small>(Apenas R$ ${precoPromo} cada!)</small>
                </div>
                ` : ''}

                <span class="qty-label">ESCOLHA A QUANTIDADE</span>
                <div class="qty-box">
                    <button class="qty-btn" onclick="mudarQtd(-1)"><i class="fas fa-minus"></i></button>
                    <span class="qty-num" id="qtdShow">1</span>
                    <button class="qty-btn" onclick="mudarQtd(1)"><i class="fas fa-plus"></i></button>
                </div>

                <div class="total-display" id="totalShow">Total: R$ ${produto.preco}</div>

                <div class="input-group"><input type="text" id="nome" placeholder="Nome Completo"></div>
                <div class="input-group"><input type="text" id="zap" placeholder="WhatsApp (DDD + Número)"></div>
                <div class="input-group"><input type="email" id="email" placeholder="E-mail para receber os números"></div>

                <button onclick="revisar()" class="btn-main">RESERVAR AGORA <i class="fas fa-arrow-right"></i></button>
            </div>
        `;
    }

    function mudarQtd(n) {
        qtd = Math.max(1, qtd + n);
        document.getElementById('qtdShow').innerText = qtd;
        let total = (produto.promoQtd && qtd >= produto.promoQtd) ? (qtd * (produto.promoPreco / produto.promoQtd)) : (qtd * produto.preco);
        document.getElementById('totalShow').innerText = `Total: R$ ${total.toFixed(2)}`;
    }

    function revisar() {
        const nome = document.getElementById('nome').value;
        const zap = document.getElementById('zap').value;
        const email = document.getElementById('email').value;
        if(!nome || !zap) return alert("Preencha Nome e WhatsApp!");

        document.getElementById('dadosConfirmar').innerHTML = `
            <p><strong>Participante:</strong> ${nome}</p>
            <p><strong>WhatsApp:</strong> ${zap}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>Qtd de Números:</strong> ${qtd}</p>
        `;
        document.getElementById('screenReview').style.display = 'block';
    }

    async function finalizarReserva() {
        const payload = {
            idProduto: produto.id,
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('zap').value,
            email: document.getElementById('email').value,
            qtd: qtd
        };

        const res = await fetch('/api/checkout-automatico', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const r = await res.json();
        if(r.sucesso) {
            abrirPagamento(r);
        }
    }

    function abrirPagamento(r) {
        document.getElementById('screenReview').style.display = 'none';
        document.getElementById('screenPayment').style.display = 'block';
        document.getElementById('finalValor').innerText = `R$ ${r.valor}`;
        document.getElementById('finalNums').innerText = r.numeros.join(', ');
        document.getElementById('pixCode').innerText = produto.pix;
        document.getElementById('resID').innerText = r.recibo.split('-')[1];

        // CRONÔMETRO REAL
        let tempo = 360;
        const display = document.getElementById('timerDisplay');
        clearInterval(cronometro);
        cronometro = setInterval(() => {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            display.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            if (--tempo < 0) { clearInterval(cronometro); location.reload(); }
        }, 1000);
    }

    function cancelarVenda() {
        if(confirm("Deseja cancelar essa reserva? Seus números serão liberados.")) {
            clearInterval(cronometro);
            location.reload();
        }
    }

    function fecharTelas() { document.querySelectorAll('.full-screen').forEach(s => s.style.display = 'none'); }
    function copiarPix() { navigator.clipboard.writeText(document.getElementById('pixCode').innerText); alert("PIX Copiado!"); }

    iniciar();
</script>
</body>
</html>
